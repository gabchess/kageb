[package]
name = "kageb-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "kageb"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
bincode = "=1.3.3"
ed25519-dalek = "=2.2.0"
getrandom = "=0.1.16"
rand = "=0.7.3"
rand_chacha = "=0.2.2"
serde = { version = "=1.0.228", features = ["derive"] }
sha2 = "=0.10.9"
threshold_crypto = { version = "=0.4.0", default-features = false }
zeroize = "=1.8.2"

[dev-dependencies]
tempfile = "=3.27.0"
