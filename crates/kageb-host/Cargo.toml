[package]
name = "kageb-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "kageb"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
bincode = "=1.3.3"
bs58 = "=0.5.1"
ed25519-dalek = "=2.2.0"
getrandom = "=0.1.16"
kageb-program = { path = "../kageb-program", features = ["no-entrypoint"] }
rand = "=0.7.3"
rand_chacha = "=0.2.2"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
solana-commitment-config = "=3.1.1"
solana-ed25519-program = "=3.0.0"
solana-keypair = "=3.1.0"
solana-loader-v3-interface = { version = "=6.1.0", features = ["serde"] }
solana-message = "=3.1.0"
solana-program = "=4.0.0"
solana-rpc-client = "=4.0.0"
solana-signature = "=3.3.0"
solana-sdk = "=4.0.1"
solana-signer = "=3.0.0"
solana-system-interface = { version = "=3.0.0", features = ["bincode"] }
solana-transaction = "=3.1.0"
solana-transaction-status-client-types = { version = "=4.0.0", features = ["agave-unstable-api"] }
spl-token-interface = "=2.0.0"
tempfile = "=3.27.0"
threshold_crypto = { version = "=0.4.0", default-features = false }
zeroize = "=1.8.2"

[dev-dependencies]
base64 = "=0.22.1"
