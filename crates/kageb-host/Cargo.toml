[package]
name = "kageb-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "kageb"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
bincode = "=1.3.3"
ed25519-dalek = "=2.2.0"
getrandom = "=0.1.16"
kageb-program = { path = "../kageb-program", features = ["no-entrypoint"] }
rand = "=0.7.3"
rand_chacha = "=0.2.2"
serde = { version = "=1.0.228", features = ["derive"] }
sha2 = "=0.10.9"
solana-commitment-config = "=3.1.1"
solana-program = "=4.0.0"
solana-rpc-client = "=4.0.0"
solana-sdk = "=4.0.1"
threshold_crypto = { version = "=0.4.0", default-features = false }
zeroize = "=1.8.2"

[dev-dependencies]
base64 = "=0.22.1"
serde_json = "=1.0.151"
tempfile = "=3.27.0"
