name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal --component clippy --component rustfmt
      - name: Install Solana CLI 4.0.1
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/solana-release.tar.bz2"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            --location \
            https://github.com/anza-xyz/agave/releases/download/v4.0.1/solana-release-x86_64-unknown-linux-gnu.tar.bz2 \
            --output "$archive"
          echo "fb78658895c4d7a8dbdd2b50f54f167db87b4072417e73c8c85da12a3b555209  $archive" \
            | sha256sum --check --strict
          tar -xjf "$archive" --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/solana-release/bin" >> "$GITHUB_PATH"
      - name: Run checks
        run: ./scripts/ci.sh

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit locked dependencies
        run: cargo audit --deny warnings

  public-evidence:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal
      - name: Install Solana CLI 4.0.1
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/solana-release.tar.bz2"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            --location \
            https://github.com/anza-xyz/agave/releases/download/v4.0.1/solana-release-x86_64-unknown-linux-gnu.tar.bz2 \
            --output "$archive"
          echo "fb78658895c4d7a8dbdd2b50f54f167db87b4072417e73c8c85da12a3b555209  $archive" \
            | sha256sum --check --strict
          tar -xjf "$archive" --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/solana-release/bin" >> "$GITHUB_PATH"
      - name: Verify public devnet evidence
        run: ./scripts/verify-public-evidence.sh
