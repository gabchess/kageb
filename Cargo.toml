[workspace]
members = ["crates/kageb-host", "crates/kageb-program"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/gabchess/kageb"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
overflow-checks = true
lto = "thin"
codegen-units = 1
strip = true
