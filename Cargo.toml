[workspace]
members = [
    "crates/kageb-host",
    "crates/kageb-program",
    "crates/kageb-token-fixture",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/gabchess/kageb"

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[profile.release]
overflow-checks = true
lto = false
codegen-units = 1
strip = true
